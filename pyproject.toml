[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devin-internals-spec"
version = "0.3.3"
description = "Documented internals of Devin Desktop/CLI session stores, schema-version detection and test fixtures (unofficial)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Icaro0310" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9", "pyyaml>=6"]
# Marker extra documenting the packaged-corpus contract — corpus access is
# stdlib-only (importlib.resources), so the extra carries no dependencies.
corpus = []

[project.scripts]
devin-inspect = "devin_internals.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# All committed corpora (session-corpus, install-states, schema-versions,
# message-schemas) ship as package
# data. Hidden entries need explicit `.*` segments — recursive `**`/`*
# globs skip dotfiles and never descend into dotdirs (.codex, .config,
# .local, .copilot, .vscode-server, .gitkeep leaves).
[tool.setuptools.package-data]
devin_internals = [
    # vendored single-file mirror of heartbeat.py (docs/HEARTBEAT.md)
    "heartbeat.js",
    "corpus/**/*",
    "corpus/**/.*",
    "corpus/**/.*/**",
    "corpus/**/.*/**/.*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
