name: ci

# Thin caller: the test and secrets-scan jobs live in the control plane
# (Icaro0310/devin-powerups/.github/workflows, tag @v1). Repos whose ci.yml
# diverges from the shared shape are documented in VARIANTS.md there.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
    uses: Icaro0310/devin-powerups/.github/workflows/python-test.yml@v1

  secrets-scan:
    permissions:
      contents: read
    uses: Icaro0310/devin-powerups/.github/workflows/secrets-scan.yml@v1

  # Always-on aggregator: the single required check. Fails on any
  # failure/cancelled/timed_out; skipped jobs pass (nothing here is
  # path-gated today — tests.yml runs unfiltered on every PR).
  ci-gate:
    if: always()
    needs: [test, secrets-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          bad = {k: v["result"] for k, v in needs.items()
                 if v["result"] not in ("success", "skipped")}
          for k, v in needs.items():
              print(f"{k}: {v['result']}")
          if bad:
              print(f"ci-gate FAIL: {bad}", file=sys.stderr)
              sys.exit(1)
          print("ci-gate PASS")
          PY
